services:
  - type: web
    name: peopledesk
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: peopledesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/peopledesk.json
      - key: ADMIN_SETUP_KEY
        generateValue: true
